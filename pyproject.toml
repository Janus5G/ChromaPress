[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromapress"
version = "1.0.0a72"
description = "Native desktop workbench for building and customizing Linux installation images."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Janus Rokkjær"}]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.scripts]
chromapress = "chromapress.app:main"
chromapress-engine = "chromapress.engine_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chromapress = ["assets/*.svg", "assets/*.png", "assets/*.txt"]
